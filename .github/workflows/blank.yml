name: Update

on:
  schedule:
  # ── Every Sunday at 00:00 UTC (02:00 Paris in summer, 01:00 in winter)
  - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22.x"
    - run: npm install
    - run: node update.js
      env:
        WAKATIMETOKEN : ${{ secrets.WAKATIMETOKEN }}
        DISCORDTOKEN  : ${{ secrets.DISCORDTOKEN }}
        GITHUBTOKEN   : ${{ secrets.GITHUBTOKEN }}
